<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>星盘 · 星座性格与恋爱匹配</title>
<style>
  :root{
    --bg:#05060d;
    --bg2:#0c0f1d;
    --panel:rgba(18,22,40,.72);
    --line:rgba(150,170,230,.16);
    --gold:#e8c37a;
    --gold-dim:rgba(232,195,122,.42);
    --text:#e9edf7;
    --text-dim:#98a2bd;
    --text-mute:#6b7590;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:"Noto Sans SC","Microsoft YaHei","PingFang SC","Hiragino Sans GB",system-ui,-apple-system,sans-serif;
    color:var(--text);
    background:var(--bg);
    min-height:100vh;
    position:relative;
    overflow-x:hidden;
    line-height:1.75;
  }

  /* ===== 星空背景 ===== */
  .stars,.stars2,.glow{position:fixed;inset:0;pointer-events:none;z-index:0}
  .stars{background-image:radial-gradient(1.4px 1.4px at 12% 18%,#fff,transparent),radial-gradient(1.2px 1.2px at 68% 8%,#dfe8ff,transparent),radial-gradient(1px 1px at 32% 62%,#fff,transparent),radial-gradient(1.6px 1.6px at 88% 44%,#fff2d0,transparent),radial-gradient(1px 1px at 52% 88%,#fff,transparent),radial-gradient(1.3px 1.3px at 8% 78%,#cfe0ff,transparent),radial-gradient(1px 1px at 78% 72%,#fff,transparent),radial-gradient(1.1px 1.1px at 42% 34%,#fff,transparent);opacity:.55;animation:tw 7s ease-in-out infinite}
  .stars2{background-image:radial-gradient(1px 1px at 22% 44%,#fff,transparent),radial-gradient(1.2px 1.2px at 58% 22%,#e6efff,transparent),radial-gradient(1px 1px at 92% 82%,#fff,transparent),radial-gradient(1px 1px at 5% 52%,#fff,transparent),radial-gradient(1.3px 1.3px at 74% 60%,#ffe9c9,transparent);opacity:.4;animation:tw 11s ease-in-out infinite reverse}
  @keyframes tw{0%,100%{opacity:.35}50%{opacity:.7}}
  .glow{background:radial-gradient(720px 480px at 22% -8%,rgba(96,74,190,.30),transparent 62%),radial-gradient(620px 420px at 92% 18%,rgba(24,86,150,.26),transparent 62%),radial-gradient(900px 600px at 50% 118%,rgba(120,62,140,.18),transparent 60%)}

  .wrap{position:relative;z-index:1;max-width:1120px;margin:0 auto;padding:44px 20px 72px}

  /* ===== 顶部 ===== */
  header{text-align:center;margin-bottom:34px}
  .eyebrow{font-size:12px;letter-spacing:.42em;color:var(--gold);text-transform:uppercase;margin-bottom:14px;padding-left:.42em}
  h1{font-size:clamp(28px,5vw,44px);font-weight:700;letter-spacing:.14em;padding-left:.14em;background:linear-gradient(180deg,#fff 12%,var(--gold) 130%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .sub{margin-top:14px;color:var(--text-dim);font-size:14.5px;letter-spacing:.06em}

  /* ===== 星盘 ===== */
  .chart-section{display:flex;justify-content:center;margin-bottom:36px}
  .wheel-box{width:min(560px,92vw);aspect-ratio:1/1;position:relative}
  .wheel-box::after{content:"";position:absolute;inset:11%;border-radius:50%;border:1px solid rgba(150,170,230,.10);pointer-events:none}
  svg{width:100%;height:100%;display:block;overflow:visible}
  .zoneline{fill:none;stroke:var(--line);stroke-width:1}
  .ring-out{fill:none;stroke:rgba(150,170,230,.22);stroke-width:1}
  .node{cursor:pointer}
  .node .disc{fill:rgba(20,25,46,.9);stroke:rgba(150,170,230,.26);stroke-width:1;transition:fill .25s,stroke .25s}
  .node .sym{fill:var(--text-dim);font-size:23px;text-anchor:middle;dominant-baseline:central;pointer-events:none;transition:fill .25s}
  .node .cap{fill:var(--text-mute);font-size:11.5px;text-anchor:middle;letter-spacing:.1em;pointer-events:none;transition:fill .25s}
  .node:hover .disc{fill:rgba(46,40,78,.95);stroke:var(--gold-dim)}
  .node:hover .sym{fill:var(--gold)}
  .node:hover .cap{fill:var(--text-dim)}
  .node.on .disc{fill:rgba(232,195,122,.16);stroke:var(--gold);stroke-width:1.6;animation:pulse 1.6s ease-out}
  .node.on .sym{fill:var(--gold)}
  .node.on .cap{fill:var(--gold)}
  @keyframes pulse{0%{stroke-opacity:1}45%{stroke-opacity:.35}100%{stroke-opacity:1}}

  /* ===== 结果区 ===== */
  .stage{position:relative}
  .empty{text-align:center;padding:52px 20px;border:1px dashed var(--line);border-radius:18px;color:var(--text-mute);font-size:14.5px;letter-spacing:.06em;background:rgba(14,18,34,.4)}
  .empty span{color:var(--gold);letter-spacing:.2em}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:30px 30px 26px;backdrop-filter:blur(14px);box-shadow:0 24px 60px -30px rgba(0,0,0,.9);animation:rise .5s cubic-bezier(.2,.8,.3,1) both}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

  .card-head{display:flex;align-items:flex-start;gap:22px;padding-bottom:24px;border-bottom:1px solid var(--line);margin-bottom:24px}
  .sigil{flex:0 0 auto;width:82px;height:82px;border-radius:50%;display:grid;place-items:center;font-size:40px;color:var(--gold);border:1px solid var(--gold-dim);background:radial-gradient(circle at 50% 30%,rgba(232,195,122,.16),rgba(232,195,122,.02) 68%)}
  .head-main{flex:1;min-width:0}
  .name-row{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
  .name-row h2{font-size:27px;letter-spacing:.1em;font-weight:700}
  .en{font-size:12.5px;letter-spacing:.28em;color:var(--text-mute);text-transform:uppercase}
  .meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .tag{font-size:12.5px;padding:4px 11px;border-radius:999px;border:1px solid var(--line);color:var(--text-dim);background:rgba(255,255,255,.02);letter-spacing:.05em}
  .tag.date{color:var(--gold);border-color:var(--gold-dim)}
  .mine{margin-left:auto;align-self:flex-start;font-size:11.5px;letter-spacing:.18em;color:#05060d;background:linear-gradient(135deg,#f0d49a,#d9ab5c);padding:5px 12px;border-radius:999px;font-weight:700;white-space:nowrap}

  .kw{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
  .kw b{font-weight:600;font-size:12.5px;color:var(--gold);background:rgba(232,195,122,.09);border:1px solid rgba(232,195,122,.2);padding:4px 10px;border-radius:7px;letter-spacing:.06em}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:26px}
  @media(max-width:780px){.grid{grid-template-columns:1fr;gap:22px}}

  h3{font-size:13px;letter-spacing:.26em;color:var(--gold);margin-bottom:14px;padding-left:.26em;text-transform:uppercase}
  p.body{font-size:15px;color:#d3d9ea;text-align:justify}

  ul.traits{list-style:none;display:flex;flex-direction:column;gap:11px}
  ul.traits li{display:flex;gap:11px;font-size:14.3px;color:#cfd6e8}
  ul.traits li i{flex:0 0 auto;width:19px;height:19px;margin-top:4px;border-radius:6px;display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:700}
  .good i{color:#8ce0b0;background:rgba(120,220,170,.12);border:1px solid rgba(120,220,170,.28)}
  .bad i{color:#f0a0a8;background:rgba(240,140,150,.12);border:1px solid rgba(240,140,150,.28)}

  /* 匹配 */
  .match-wrap{margin-top:30px;padding-top:26px;border-top:1px solid var(--line)}
  .matches{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  @media(max-width:780px){.matches{grid-template-columns:1fr}}
  .match{border:1px solid var(--line);border-radius:14px;padding:17px;background:rgba(255,255,255,.017);transition:border-color .25s,transform .25s,background .25s}
  .match:hover{border-color:var(--gold-dim);transform:translateY(-3px);background:rgba(232,195,122,.045)}
  .match .top{display:flex;align-items:center;gap:10px;margin-bottom:9px}
  .match .top .s{font-size:23px;color:var(--gold)}
  .match .top .n{font-size:15.5px;font-weight:600;letter-spacing:.06em}
  .match .pct{margin-left:auto;font-size:12px;color:var(--gold);border:1px solid var(--gold-dim);border-radius:999px;padding:2px 9px;letter-spacing:.04em}
  .match .why{font-size:13.4px;color:var(--text-dim);text-align:justify;line-height:1.72}

  .note{margin-top:26px;padding-top:20px;border-top:1px solid var(--line);font-size:12.6px;color:var(--text-mute);text-align:justify;letter-spacing:.02em}

  footer{text-align:center;margin-top:40px;font-size:12.4px;color:var(--text-mute);letter-spacing:.1em;line-height:2}
  footer b{color:var(--gold-dim);font-weight:400}

  .fade-in{animation:rise .45s cubic-bezier(.2,.8,.3,1) both}
</style>
</head>

<div class="wrap">
  <header>
    <div class="eyebrow">Zodiac</div>

</div>

    good:["遇到喜欢的人和事敢直接表达","执行力强，在混乱局面里第一个站出来","心地干净，不搞背后算计","恢复力极强，摔倒了拍拍土就走"],
    bad:["耐心有限，三分钟热度是常态","说话不过滤，容易在无意中伤人","争强好胜，容易把合作变成较劲","不太擅长处理细腻迂回的感情信号"],

  {

  },
  {

const RING = 172, CX = 220, CY = 220, R_IN = 70, R_OUT = 416;

/* ============ 构建星盘 ============ */
function buildWheel(){
  const SVGC = 'http://www.w3.org/2000/svg';
  const zones = document.getElementById('zones');
  const nodes = document.getElementById('nodes');

  /* 12 宫分界线 */
  for(let i=0;i<12;i++){
    const a = (i*30 - 90) * Math.PI/180;
    const line = document.createElementNS(SVGC,'line');
    line.setAttribute('class','zoneline');
    line.setAttribute('x1',(CX+R_IN*Math.cos(a)).toFixed(2));
    line.setAttribute('y1',(CY+R_IN*Math.sin(a)).toFixed(2));
    line.setAttribute('x2',(CX+R_OUT*Math.cos(a)).toFixed(2));
    line.setAttribute('y2',(CY+R_OUT*Math.sin(a)).toFixed(2));
    zones.appendChild(line);
  }

  /* 星座节点 */
  for(let i=0;i<12;i++){
    const s = SIGNS[i];
    const a = (i*30 - 90) * Math.PI/180;
    const x = CX + RING*Math.cos(a);
    const y = CY + RING*Math.sin(a);
    const la = CX + (RING-52)*Math.cos(a);
    const ly = CY + (RING-52)*Math.sin(a);

    const g = document.createElementNS(SVGC,'g');
    g.setAttribute('class','node');
    g.setAttribute('data-i', i);
    g.setAttribute('role','listitem');
    g.setAttribute('tabindex','0');
    g.setAttribute('aria-label', s.name);

    const disc = document.createElementNS(SVGC,'circle');
    disc.setAttribute('class','disc');
    disc.setAttribute('cx', x.toFixed(2));
    disc.setAttribute('cy', y.toFixed(2));
    disc.setAttribute('r','27');

    const sym = document.createElementNS(SVGC,'text');
    sym.setAttribute('class','sym');
    sym.setAttribute('x', x.toFixed(2));
    sym.setAttribute('y', y.toFixed(2));
    sym.textContent = s.sym;

    const cap = document.createElementNS(SVGC,'text');
    cap.setAttribute('class','cap');
    cap.setAttribute('x', la.toFixed(2));
    cap.setAttribute('y', ly.toFixed(2));
    cap.textContent = s.name.replace('座','');

    g.appendChild(disc); g.appendChild(sym); g.appendChild(cap);
    nodes.appendChild(g);
  }
}

/* ============ 选择逻辑 ============ */
let current = -1;
const empty = document.getElementById('empty');
const result = document.getElementById('result');

function select(i, isToday){
  current = i;
  const all = document.querySelectorAll('.node');
  for(let n=0;n<all.length;n++) all[n].classList.toggle('on', +all[n].getAttribute('data-i') === i);
  empty.hidden = true;
  result.innerHTML = render(SIGNS[i], isToday === true);
  if(window.matchMedia('(max-width:780px)').matches){
    result.scrollIntoView({behavior:'smooth', block:'start'});
  }
}

function li(arr, cls){
  const mark = cls === 'good' ? '\u2713' : '!';
  return arr.map(t=>'<li class="'+cls+'"><i>'+mark+'</i><span>'+t+'</span></li>').join('');
}

function render(s, isToday){
  return ''
  + '<article class="card">'
  +   '<div class="card-head">'
  +     '<div class="sigil">'+s.sym+'</div>'
  +     '<div class="head-main">'
  +       '<div class="name-row"><h2>'+s.name+'</h2><span class="en">'+s.en+'</span>'
  +         (isToday ? '<span class="mine">今天 · 你的星座</span>' : '')
  +       '</div>'
  +       '<div class="meta">'
  +         '<span class="tag date">'+s.date+'</span>'
  +         '<span class="tag">'+s.element+'</span>'
  +         '<span class="tag">'+s.mode+'</span>'
  +         '<span class="tag">守护星 · '+s.ruler+'</span>'
  +       '</div>'
  +       '<div class="kw">'+s.keywords.map(k=>'<b>'+k+'</b>').join('')+'</div>'
  +     '</div>'
  +   '</div>'

  +   '<div class="grid">'
  +     '<div><h3>性格底色</h3><p class="body">'+s.body+'</p></div>'
  +     '<div><h3>优势</h3><ul class="traits">'+li(s.good,'good')+'</ul></div>'
  +   '</div>'

  +   '<div class="grid" style="margin-top:26px">'
  +     '<div><h3>需要留意</h3><ul class="traits">'+li(s.bad,'bad')+'</ul></div>'
  +     '<div><h3>元素属性</h3><p class="body">'+elementNote(s.element)+'</p></div>'
  +   '</div>'

  +   '<div class="match-wrap">'
  +     '<h3>恋爱最佳匹配</h3>'
  +     '<div class="matches">'
  +       s.matches.map(m=>{
            const t = SIGNS.find(x=>x.name===m.s);
            return '<div class="match">'
              + '<div class="top"><span class="s">'+t.sym+'</span><span class="n">'+m.s+'</span><span class="pct">'+m.pct+'</span></div>'
              + '<div class="why">'+m.why+'</div>'
              + '</div>';
          }).join('')
  +     '</div>'
  +     '<div class="note">匹配逻辑基于占星学传统的元素（火 / 土 / 风 / 水）与宫位性质（基本 / 固定 / 变动）关系，结合通行解读整理。配对百分比为便于比较而作的示意性排序，并非统计结论。</div>'
  +   '</div>'
  + '</article>';
}

function elementNote(el){
  const map = {
    '火象':'火象星座（白羊 / 狮子 / 射手）以行动力和热情为核心，需要被回应、被点燃。他们与同为火象或风象的组合通常最有活力，与土象、水象相处则需要更多的耐心与解释。',
    '土象':'土象星座（金牛 / 处女 / 摩羯）以稳定和务实为核心，用实际付出而非言语表达爱。他们与同为土象或水象的组合最安稳，与火象、风象相处则要学会接受不确定与变化。',
    '风象':'风象星座（双子 / 天秤 / 水瓶）以交流与理性为核心，需要精神层面的对等与自由空间。他们与同为风象或火象的组合最轻快，与土象、水象相处时要留意“讲道理”并不能替代“给情绪”。',
    '水象':'水象星座（巨蟹 / 天蝎 / 双鱼）以感受与共情为核心，情绪的深度就是他们爱的深度。他们与同为水象或土象的组合最能安心，与火象、风象相处时最容易因表达方式不同而受伤。'
  };
  return map[el] || '';
}

/* 事件 */
document.getElementById('nodes').addEventListener('click', e=>{
  const g = e.target.closest('.node');
  if(g) select(+g.dataset.i);
});
document.getElementById('nodes').addEventListener('keydown', e=>{
  const g = e.target.closest('.node');
  if(g && (e.key==='Enter' || e.key===' ')){ e.preventDefault(); select(+g.dataset.i); }
});

buildWheel();
